name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libfontconfig1 libdbus-1-3
      - run: python -m pip install -e ".[gui,dev]"
      - run: python -m pytest -q --cov=curseofdroid --cov-report=term --cov-report=xml --cov-fail-under=65
      - name: Qt Quick smoke test (no USB probes)
        run: python -m curseofdroid.gui.app --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python }}
          path: coverage.xml
      # real downloads on every OS: Google's platform-tools for this OS, and the CLI on top of it
      - name: platform-tools + CLI smoke test
        shell: bash
        run: |
          export CURSEOFDROID_HOME="$RUNNER_TEMP/cod"
          curseofdroid tools install
          curseofdroid tools
          curseofdroid drivers
          curseofdroid detect || true   # no phone on CI: must exit cleanly with a message
          curseofdroid find lavender --project TWRP
      - name: Google USB Driver download (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          export CURSEOFDROID_HOME="$RUNNER_TEMP/cod"
          python -c "from curseofdroid.platform.drivers import download_google_usb_driver as d; p=d(); print(p); assert (p/'android_winusb.inf').is_file()"
