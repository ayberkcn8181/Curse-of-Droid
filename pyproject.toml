[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curseofdroid"
version = "0.1.0a5"
description = "Install custom ROMs and recoveries on Android phones: detect, unlock (officially), find, verify, flash."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = ["certifi", "PyYAML>=6"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
curseofdroid = "curseofdroid.cli:main"

[project.gui-scripts]
curseofdroid-gui = "curseofdroid.gui.app:main"

[tool.setuptools.packages.find]
include = ["curseofdroid*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
