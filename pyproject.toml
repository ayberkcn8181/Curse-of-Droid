[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "romtool"
version = "0.1.0.dev0"
description = "Install custom ROMs and recoveries on Android phones: detect, unlock (officially), find, verify, flash."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8"]

[project.scripts]
romtool = "romtool.cli:main"

[tool.setuptools.packages.find]
include = ["romtool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
